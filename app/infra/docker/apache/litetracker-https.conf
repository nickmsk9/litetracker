<IfModule mod_ssl.c>
	<VirtualHost *:443>
		ServerName localhost
		ServerAlias *.localhost

		DocumentRoot /var/www/html/public

		SSLEngine on
		SSLCertificateFile /etc/apache2/ssl/litetracker.crt
		SSLCertificateKeyFile /etc/apache2/ssl/litetracker.key

		RequestHeader set X-Forwarded-Proto "https"
		SetEnv HTTPS on

		<Directory /var/www/html>
			AllowOverride None
			Require all denied
		</Directory>

		<Directory /var/www/html/public>
			AllowOverride All
			Require all granted
		</Directory>

		<LocationMatch "^/(?:database|system|logs|docker|vendor|\.git)(?:/|$)">
			Require all denied
		</LocationMatch>

		<LocationMatch "^/(?:\.env(?:\..*)?|composer\.(?:json|lock)|docker-compose(?:\.[^/]+)?\.ya?ml|Dockerfile)$">
			Require all denied
		</LocationMatch>

		Alias /public/ /var/www/html/public/
	</VirtualHost>
</IfModule>
