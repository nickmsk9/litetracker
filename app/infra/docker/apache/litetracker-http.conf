<VirtualHost *:80>
	ServerName localhost
	ServerAlias *.localhost

	DocumentRoot /var/www/html/public

	<Directory /var/www/html>
		AllowOverride None
		Require all denied
	</Directory>

	<Directory /var/www/html/public>
		AllowOverride All
		Require all granted
	</Directory>

	<LocationMatch "^/(?:database|system|logs|docker-data|docker|vendor|tests|\.git)(?:/|$)">
		Require all denied
	</LocationMatch>

	<LocationMatch "^/(?:\.env(?:\..*)?|composer\.(?:json|lock)|docker-compose(?:\.[^/]+)?\.ya?ml|Dockerfile)$">
		Require all denied
	</LocationMatch>

	Alias /public/ /var/www/html/public/
</VirtualHost>
