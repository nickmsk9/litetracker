<IfModule mod_ssl.c>
	<VirtualHost *:443>
		ServerName localhost
		ServerAlias *.localhost

		DocumentRoot /var/www/html

		SSLEngine on
		SSLCertificateFile /etc/apache2/ssl/litetracker.crt
		SSLCertificateKeyFile /etc/apache2/ssl/litetracker.key

		RequestHeader set X-Forwarded-Proto "https"
		SetEnv HTTPS on

		<Directory /var/www/html>
			AllowOverride All
			Require all granted
		</Directory>
	</VirtualHost>
</IfModule>
