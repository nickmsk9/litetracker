services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: litetracker-php
    restart: unless-stopped
    ports:
      - "${LITETRACKER_HOST_HTTP_PORT:-8094}:80"
      - "${LITETRACKER_HOST_HTTPS_PORT:-443}:443"
    environment:
      LITETRACKER_CACHE_DRIVER: memcached
      LITETRACKER_CACHE_HOST: memcached
      LITETRACKER_CACHE_PORT: 11211
      LITETRACKER_CRON_MODE: external
      LITETRACKER_SQL_DEBUG: "0"
      LITETRACKER_PUBLIC_SCHEME: "${LITETRACKER_PUBLIC_SCHEME:-http}"
      LITETRACKER_PUBLIC_HOST: "${LITETRACKER_PUBLIC_HOST:-localhost:8094}"
      LITETRACKER_ANNOUNCE_HOST: "${LITETRACKER_ANNOUNCE_HOST:-localhost:8094}"
      LITETRACKER_ANNOUNCE_URL: "${LITETRACKER_ANNOUNCE_URL:-http://localhost:8094/announce.php}"
      LITETRACKER_DB_PASSWORD: "${LITETRACKER_DB_PASSWORD:-}"
      LITETRACKER_CRON_TOKEN: "${LITETRACKER_CRON_TOKEN:-litetracker-local-cron-token}"
      LITETRACKER_TLS_HOSTS: localhost,bt.localhost
      LITETRACKER_RECAPTCHA_ENABLED: "${LITETRACKER_RECAPTCHA_ENABLED:-0}"
      LITETRACKER_RECAPTCHA_SIGNUP: "${LITETRACKER_RECAPTCHA_SIGNUP:-1}"
      LITETRACKER_RECAPTCHA_PUBLICKEY: "${LITETRACKER_RECAPTCHA_PUBLICKEY:-}"
      LITETRACKER_RECAPTCHA_PRIVATEKEY: "${LITETRACKER_RECAPTCHA_PRIVATEKEY:-}"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
      - memcached
    networks:
      - litetracker-net

  db:
    image: mysql:8.4
    container_name: litetracker-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lite
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_PASSWORD: "${LITETRACKER_DB_PASSWORD:-}"
    ports:
      - "3309:3306"
    volumes:
      - ./docker-data/mysql:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - litetracker-net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: litetracker-phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
    ports:
      - "8095:80"
    networks:
      - litetracker-net

  memcached:
    image: memcached:latest
    container_name: litetracker-memcached
    restart: unless-stopped
    ports:
      - "11213:11211"
    networks:
      - litetracker-net

  scheduler:
    image: curlimages/curl:8.7.1
    container_name: litetracker-scheduler
    restart: unless-stopped
    depends_on:
      - php
    command:
      - sh
      - -lc
      - |
        while true; do
          curl -kfsS -H "X-Cron-Token: $${LITETRACKER_CRON_TOKEN:-litetracker-local-cron-token}" https://php/autoclean.php >/dev/null || true
          minute=$$(date +%M)
          if [ $$((10#$${minute} % 10)) -eq 0 ]; then
            curl -kfsS -H "X-Cron-Token: $${LITETRACKER_CRON_TOKEN:-litetracker-local-cron-token}" https://php/update.peers.php >/dev/null || true
          fi
          sleep 60
        done
    networks:
      - litetracker-net

networks:
  litetracker-net:
    driver: bridge
